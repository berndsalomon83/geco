[package]
name = "geco"
version = "0.8.0"
edition = "2021"
# Determined by bisecting, not guessed: darling 0.23 (via rmcp's macros)
# requires 1.88. CI checks this floor so it can't drift upward by accident.
rust-version = "1.88"
description = "geco — the generic connector: MCP gateway that keeps tools, skills, and more out of your context until the moment you summon them"
license = "MIT"

[dependencies]
rmcp = { version = "2.2", features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "time", "sync", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "6"
sha2 = "0.11"
serde_norway = "0.9"
chrono = { version = "0.4", features = ["serde"] }
notify = "8.2.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
