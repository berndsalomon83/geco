# yaml-language-server: $schema=./geco.schema.json
# geco configuration (YAML — standard; JSON also accepted, entries are
# copy-paste compatible with Claude Desktop / OpenCode mcpServers blocks).
# Location: ~/.config/geco/config.yaml
# Schema:   geco schema > ~/.config/geco/geco.schema.json

skills:
  dirs: ["~/.config/opencode/skills-library"]
  # Swept into the library on every scan, not only at startup — both these
  # and `dirs` are watched, so a skill dropped in while geco is running is
  # searchable within seconds with nothing restarted.
  absorb: ["~/.config/opencode/skills"]

proxy:
  call_timeout_secs: 120
  startup_timeout_secs: 60     # first npx run downloads — be generous
  refresh_on_start: true       # re-scan when this file's hash changes
  health_check_secs: 30        # 0 to disable dead-backend detection
  refresh_concurrency: 8       # backends probed at once on refresh (0 = all)

  # Backends do NOT inherit geco's environment (since 0.7). Each child gets
  # an OS/runtime baseline — PATH, HOME, TMPDIR, locale, TLS trust, proxy
  # settings — plus whatever its own `env` / `pass_env` declare. So a token
  # exported in your shell for one server never reaches the others.
  # inherit_env: true            # restore pre-0.7 behaviour (not recommended)
  # env_passthrough: ["NODE_*"]  # extra non-secret vars for every backend

  # Words a query and a tool use differently for the same thing. Applied on
  # top of the built-in table, matched after the same stemming.
  # search_synonyms: [["k8s", "kubernetes"], ["repo", "repository"]]

  # How many meta-tools to advertise. The default `lean` serves search,
  # execute and read_skill. `full` adds list_mcp_servers, list_tools and
  # list_skills — a quarter of the always-on surface for things reachable
  # anyway: search("*") is the catalogue, search("*", kind="skills") lists
  # skills, search(include_schema=true) returns schemas, and gateway `issues`
  # ride on search responses. A search that matches nothing also volunteers
  # the server list on its own. What lean loses is enumerating ONE server's
  # full tool list. `geco stats` counts calls per meta-tool if you want to
  # check whether the browse tools would earn their kilobyte for you.
  # surface: full

  # OPTIONAL LLM tool picker — off unless you turn it on. Lexical ranking
  # puts the right tool first only ~13% of the time when the request shares
  # no vocabulary with it; handing the candidates to a real model and asking
  # which one you meant measured 3x better (40% rank-1, 87% precision when
  # the answer was in the list). Costs a model round-trip per search. Every
  # failure falls back to the lexical order, so this can add latency but
  # cannot break search. See README "Crossing the wall".
  # Serves skills as well as tools: one call over one combined catalogue, so
  # the model answers "which capability fits" rather than being made to name
  # a skill for a request that wanted a tool.
  # picker:
  #   mode: command        # off (default) | auto | sampling | command
  #   # `sampling` borrows your CLIENT's model over MCP — zero config, but
  #   # only works if your client implements it. `command` runs anything and
  #   # reads stdout; `{prompt}` is substituted, or appended if absent.
  #   command: ["opencode", "run", "--agent", "minimal", "{prompt}"]
  #   # When the whole catalogue fits in roughly this many tokens, the model
  #   # is shown EVERY tool and lexical retrieval is skipped. Measured on a
  #   # realistic 8-server config: 94.8% rank-1 vs 74.6% for a top-50
  #   # shortlist — and faster, because an unchanging catalogue is a prompt
  #   # prefix the server can cache (96.6% cached, 0.9s vs 2.2s). 0 disables.
  #   whole_catalogue_tokens: 24000
  #   candidates: 50       # fallback shortlist, for catalogues over budget
  #   timeout_secs: 20     # then give up and return the lexical order

mcpServers:
  playwright:
    command: [npx, "@playwright/mcp@latest"]
    description: "Browser automation: navigate, click, screenshots, E2E checks."
    # Per-server timeout overrides, for the one backend that's legitimately
    # slow — rather than loosening the bound for every other server too.
    startup_timeout_secs: 120
    call_timeout_secs: 300

  context7:
    command: [npx, -y, "@upstash/context7-mcp"]
    description: "Up-to-date library docs and code examples."

  github:
    command: [github-mcp-server, stdio]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${keychain:github_token}"
      GITHUB_TOOLSETS: "repos,issues,pull_requests"
    description: "GitHub: repos, issues, pull requests."
    deny: ["delete_*"]
    # pass_env: ["GITHUB_TOKEN"]  # hand THIS server a var from geco's env;
                                  # servers that don't list it never see it

  websearch:
    command: [npx, -y, mcp-searxng]
    env:
      SEARXNG_URL: "http://spark.local:8888"
    description: "Web search via self-hosted SearXNG; also reads result URLs."
