# yaml-language-server: $schema=./geco.schema.json
# geco configuration (YAML — standard; JSON also accepted, entries are
# copy-paste compatible with Claude Desktop / OpenCode mcpServers blocks).
# Location: ~/.config/geco/config.yaml
# Schema:   geco schema > ~/.config/geco/geco.schema.json

skills:
  dirs: ["~/.config/opencode/skills-library"]
  absorb: ["~/.config/opencode/skills"]   # swept into the library at startup

proxy:
  call_timeout_secs: 120
  startup_timeout_secs: 60     # first npx run downloads — be generous
  refresh_on_start: true       # re-scan when this file's hash changes
  health_check_secs: 30        # 0 to disable dead-backend detection

  # Backends do NOT inherit geco's environment (since 0.7). Each child gets
  # an OS/runtime baseline — PATH, HOME, TMPDIR, locale, TLS trust, proxy
  # settings — plus whatever its own `env` / `pass_env` declare. So a token
  # exported in your shell for one server never reaches the others.
  # inherit_env: true            # restore pre-0.7 behaviour (not recommended)
  # env_passthrough: ["NODE_*"]  # extra non-secret vars for every backend

mcpServers:
  playwright:
    command: [npx, "@playwright/mcp@latest"]
    description: "Browser automation: navigate, click, screenshots, E2E checks."

  context7:
    command: [npx, -y, "@upstash/context7-mcp"]
    description: "Up-to-date library docs and code examples."

  github:
    command: [github-mcp-server, stdio]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${keychain:github_token}"
      GITHUB_TOOLSETS: "repos,issues,pull_requests"
    description: "GitHub: repos, issues, pull requests."
    deny: ["delete_*"]
    # pass_env: ["GITHUB_TOKEN"]  # hand THIS server a var from geco's env;
                                  # servers that don't list it never see it

  websearch:
    command: [npx, -y, mcp-searxng]
    env:
      SEARXNG_URL: "http://spark.local:8888"
    description: "Web search via self-hosted SearXNG; also reads result URLs."
