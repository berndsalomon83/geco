version: 2

# Zero-maintenance dependency updates. Worth noting what this buys beyond
# convenience: the Node 20 deprecation on actions/checkout@v4 sat unnoticed
# across four runs and was only found by reading annotations by hand. The
# github-actions ecosystem below is exactly the thing that catches that class
# of problem automatically.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor churn across ~160 crates, instead
      # of a dozen. Majors still come through individually, because those are
      # the ones that deserve to be read.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      # dtolnay/rust-toolchain is pinned TWICE for different reasons. The msrv
      # job pins it to the exact Rust version in Cargo.toml's `rust-version`,
      # where it is a floor to test against, not a dependency to keep fresh.
      # Dependabot proposed 1.88.0 -> 1.100.0, which would have left that job
      # green while testing nothing: it would compile against a toolchain 12
      # releases past the floor it exists to guard.
      #
      # Raising the MSRV should start in Cargo.toml, deliberately, with the
      # job following. Until then this action moves by hand.
      - dependency-name: "dtolnay/rust-toolchain"
