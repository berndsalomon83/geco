name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Only the release workflow needs write, and it
# asks for it per-job.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it: the older result is
# worthless once a newer commit is being tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Don't cancel the other platforms when one fails — geco has real
      # platform-specific code (keychain backends, HOME vs USERPROFILE, the
      # .exe probing in binary_exists) and "which platforms broke" is the
      # single most useful thing a red run can tell us.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The e2e suite drives a real child MCP server written in Python. With
      # no interpreter every one of those tests skips itself and the run goes
      # green having exercised almost nothing — so we install one explicitly
      # AND set GECO_REQUIRE_E2E below to turn a missing interpreter into a
      # failure rather than a silent no-op.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked
        env:
          GECO_REQUIRE_E2E: 1
          # Exercise the real OS credential store. Opt-in because the test
          # writes a throwaway item; CI runners are disposable, a developer's
          # login keychain is not.
          #
          # macOS only. On the Windows runner `cmdkey` cannot create the
          # fixture — the Actions session has no interactive credential store,
          # so the test fails setting up rather than testing anything. It
          # works on a real Windows desktop (verified by hand), so the test
          # stays and is run locally with GECO_TEST_KEYCHAIN=1.
          GECO_TEST_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking since the tree was formatted in 58e8ce2. It was advisory while
    # 214 hunks of drift existed — and that drift only grew, because a warning
    # nobody has to act on is a warning nobody acts on. Run `cargo fmt` before
    # pushing; that commit is in .git-blame-ignore-revs so blame still points
    # at whoever wrote the line.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  deny:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Known vulnerabilities, license policy, banned crates and crate sources,
    # across ~160 transitive dependencies. Policy lives in deny.toml.
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Without this, "builds on stable" has no floor and the minimum silently
    # rises the first time anyone uses a newly stabilised API.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --all-targets

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Catches broken intra-doc links and malformed doc comments — e.g. a bare
    # `Vec<String>` in prose, which rustdoc reads as an unclosed HTML tag.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  lint:
    name: lint (shell, powershell, actions, spelling, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Grouped into one job on purpose: all of these are seconds-fast and need
    # no Rust toolchain, so five separate runners would cost more in startup
    # than the checks themselves. Each step names itself clearly on failure.
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, which needs all of it.
          fetch-depth: 0

      # The installers are the entry point and have had three bugs between
      # them (CRLF endings, `2>&1`, `2>$null`); neither was linted until now.
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh picker/pick.sh

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = @()
          foreach ($f in @('install.ps1', 'uninstall.ps1')) {
            $found += Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($found.Count -gt 0) {
            $found | Format-List
            throw "PSScriptAnalyzer: $($found.Count) finding(s)"
          }
          Write-Output 'PSScriptAnalyzer: clean'

      # The pipeline itself is now two workflows with matrix logic and shell
      # blocks. Typo an `if:` expression and it silently evaluates false —
      # which is how a check quietly stops running without anyone noticing.
      - name: actionlint
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint

      # Tool and skill descriptions are read by MODELS, so a typo there is a
      # search-quality bug rather than a cosmetic one.
      - uses: crate-ci/typos@master

      # geco exists to handle secrets. A credential committed to history is
      # the worst-case failure for this project specifically.
      - name: gitleaks
        run: |
          curl -sSLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1

  # Warnings are per-job annotations, which means they are effectively
  # invisible: you have to open each job to find them. That is how a Node 20
  # deprecation notice sat unnoticed across four runs. This job collects every
  # non-failure annotation in the run into the run summary, so warnings are
  # readable from the run page without drilling in.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational, NOT a required check and NOT gated on a threshold.
    #
    # The reason it exists: src/backend.rs sat at 461 lines with zero direct
    # unit tests, and that was discovered by a human reading a file listing.
    # The first tests written against it found a panic in a documented config
    # option. Nothing in the pipeline could have pointed at that file.
    #
    # A percentage gate would be the wrong fix — it drives tests toward
    # whatever is cheapest to cover rather than whatever is riskiest. The
    # per-file table in the run summary is the useful part: it makes "nothing
    # tests this at all" visible without pretending a number is a target.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Measure
        run: cargo llvm-cov --locked --summary-only --json --output-path cov.json

      - name: Report
        run: |
          set -uo pipefail
          {
            echo "## Coverage"
            echo
            echo "| file | lines | covered | % |"
            echo "|---|---:|---:|---:|"
            jq -r '
              .data[0].files[]
              | select(.filename | test("/src/"))
              | [ (.filename | sub(".*/src/"; "src/")),
                  .summary.lines.count,
                  .summary.lines.covered,
                  (.summary.lines.percent | floor)
                ] | @tsv
            ' cov.json \
              | sort -t$'\t' -k4 -n \
              | awk -F'\t' '{ printf "| `%s` | %s | %s | %s%% |\n", $1, $2, $3, $4 }'
            echo
            jq -r '.data[0].totals.lines
                   | "**Total: \(.covered)/\(.count) lines (\(.percent | floor)%)**"' cov.json
            echo
            echo "_Informational. Sorted worst-first — the top rows are where a bug"
            echo "has nowhere to be caught._"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: cov.json
          retention-days: 14

  warnings:
    name: surface warnings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, fmt, deny, msrv, docs, lint]
    if: always()
    permissions:
      contents: read
      checks: read
    steps:
      - name: Collect annotations into the run summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          tmp="$(mktemp)"
          for id in $(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                        --jq '.check_runs[].id' 2>/dev/null || true); do
            gh api "repos/$REPO/check-runs/$id/annotations" --jq \
              '.[] | select(.annotation_level != "failure")
                   | "- **\(.annotation_level)** — \(.message | split("\n")[0])"' \
              >> "$tmp" 2>/dev/null || true
          done

          {
            echo "## CI warnings"
            echo
            if [ -s "$tmp" ]; then
              sort -u "$tmp" | head -50
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$tmp" ]; then
            n="$(sort -u "$tmp" | wc -l | tr -d ' ')"
            echo "::warning::$n warning(s) in this run — see the run summary"
          fi
