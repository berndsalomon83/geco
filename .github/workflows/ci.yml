name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms when one fails — geco has real
      # platform-specific code (keychain backends, HOME vs USERPROFILE, the
      # .exe probing in binary_exists) and "which platforms broke" is the
      # single most useful thing a red run can tell us.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The e2e suite drives a real child MCP server written in Python. With
      # no interpreter every one of those tests skips itself and the run goes
      # green having exercised almost nothing — so we install one explicitly
      # AND set GECO_REQUIRE_E2E below to turn a missing interpreter into a
      # failure rather than a silent no-op.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked
        env:
          GECO_REQUIRE_E2E: 1
          # Exercise the real OS credential store where there is one. Opt-in
          # because the test writes a throwaway item; CI runners are
          # disposable, a developer's login keychain is not.
          GECO_TEST_KEYCHAIN: ${{ (runner.os == 'macOS' || runner.os == 'Windows') && '1' || '' }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Blocking since the tree was formatted in 58e8ce2. It was advisory while
    # 214 hunks of drift existed — and that drift only grew, because a warning
    # nobody has to act on is a warning nobody acts on. Run `cargo fmt` before
    # pushing; that commit is in .git-blame-ignore-revs so blame still points
    # at whoever wrote the line.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --check

  # Warnings are per-job annotations, which means they are effectively
  # invisible: you have to open each job to find them. That is how a Node 20
  # deprecation notice sat unnoticed across four runs. This job collects every
  # non-failure annotation in the run into the run summary, so warnings are
  # readable from the run page without drilling in.
  warnings:
    name: surface warnings
    runs-on: ubuntu-latest
    needs: [test, fmt]
    if: always()
    permissions:
      contents: read
      checks: read
    steps:
      - name: Collect annotations into the run summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          tmp="$(mktemp)"
          for id in $(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                        --jq '.check_runs[].id' 2>/dev/null || true); do
            gh api "repos/$REPO/check-runs/$id/annotations" --jq \
              '.[] | select(.annotation_level != "failure")
                   | "- **\(.annotation_level)** — \(.message | split("\n")[0])"' \
              >> "$tmp" 2>/dev/null || true
          done

          {
            echo "## CI warnings"
            echo
            if [ -s "$tmp" ]; then
              sort -u "$tmp" | head -50
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$tmp" ]; then
            n="$(sort -u "$tmp" | wc -l | tr -d ' ')"
            echo "::warning::$n warning(s) in this run — see the run summary"
          fi
