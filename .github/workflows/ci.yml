name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms when one fails — geco has real
      # platform-specific code (keychain backends, HOME vs USERPROFILE, the
      # .exe probing in binary_exists) and "which platforms broke" is the
      # single most useful thing a red run can tell us.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The e2e suite drives a real child MCP server written in Python. With
      # no interpreter every one of those tests skips itself and the run goes
      # green having exercised almost nothing — so we install one explicitly
      # AND set GECO_REQUIRE_E2E below to turn a missing interpreter into a
      # failure rather than a silent no-op.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked
        env:
          GECO_REQUIRE_E2E: 1

  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the codebase uses deliberate compact formatting in
    # places (single-line guard clauses, hand-aligned tables) that rustfmt
    # would rewrite wholesale — ~177 diff hunks. Blocking on it would mean
    # either a large reformat commit or a pile of #[rustfmt::skip].
    #
    # The step reports drift as a warning annotation and exits 0, so the run
    # stays green and a genuine failure elsewhere is never lost in the noise
    # of a permanently-red advisory job. Make this blocking (drop the `if !`)
    # after a deliberate `cargo fmt` pass, if that's the direction you want.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check (advisory)
        run: |
          if ! cargo fmt --check; then
            echo "::warning::rustfmt drift present — advisory only, see log above"
          fi

  # Warnings are per-job annotations, which means they are effectively
  # invisible: you have to open each job to find them. That is how a Node 20
  # deprecation notice sat unnoticed across four runs. This job collects every
  # non-failure annotation in the run into the run summary, so warnings are
  # readable from the run page without drilling in.
  warnings:
    name: surface warnings
    runs-on: ubuntu-latest
    needs: [test, fmt]
    if: always()
    permissions:
      contents: read
      checks: read
    steps:
      - name: Collect annotations into the run summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          tmp="$(mktemp)"
          for id in $(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
                        --jq '.check_runs[].id' 2>/dev/null || true); do
            gh api "repos/$REPO/check-runs/$id/annotations" --jq \
              '.[] | select(.annotation_level != "failure")
                   | "- **\(.annotation_level)** — \(.message | split("\n")[0])"' \
              >> "$tmp" 2>/dev/null || true
          done

          {
            echo "## CI warnings"
            echo
            if [ -s "$tmp" ]; then
              sort -u "$tmp" | head -50
            else
              echo "_none_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$tmp" ]; then
            n="$(sort -u "$tmp" | wc -l | tr -d ' ')"
            echo "::warning::$n warning(s) in this run — see the run summary"
          fi
